name: Release

# Publishes a GitHub release with the plugin ZIP and the matching CHANGELOG section:
# - on a pushed tag like v1.0.0,
# - after the CI workflow ("WordPress plugin checks") succeeded for a push to main, for
#   v<plugin version>, unless that release exists already; the tag is then created on exactly
#   the commit CI tested (workflow_run head_sha),
# - on manual runs from main (workflow_dispatch).
#
# Release gate (build/verify-release.sh), for every trigger, before anything is built: the commit
# must be on main (ancestor of origin/main), the CI workflow (ci.yml) must have succeeded for
# exactly that commit (queried via the Actions API; running CI is waited for), and the tag must
# match the plugin header Version, WPCAP_VERSION and the readme.txt Stable tag.
on:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows: ['WordPress plugin checks']
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Least privilege: nothing by default, the release job gets what it needs.
permissions: {}

# Never publish two releases at the same time (e.g. tag push and CI completion overlapping).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Tags and manual runs from main; for CI runs only successful pushes to main (not PRs).
    if: >-
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write # create the release (and the tag for CI-triggered runs)
      actions: read # read CI workflow runs for the release commit
    env:
      # The commit to release: the one CI tested for workflow_run, else the triggering commit.
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          # Full history so the ancestry check against origin/main works.
          fetch-depth: 0

      - name: Determine tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "SKIP=" >> "$GITHUB_ENV"
          else
            version="$(sed -n 's/^ \* Version: *//p' pass-captain.php | head -n1)"
            test -n "$version" || { echo "No plugin version found"; exit 1; }
            echo "TAG=v${version}" >> "$GITHUB_ENV"
            # Already released (e.g. a later push without version bump): nothing to do.
            if gh release view "v${version}" >/dev/null 2>&1; then echo "SKIP=1" >> "$GITHUB_ENV"; echo "Release v${version} exists"; else echo "SKIP=" >> "$GITHUB_ENV"; fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify release commit (on main, CI passed for this SHA, versions match the tag)
        if: env.SKIP == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The checkout is the release commit itself; HEAD must be exactly RELEASE_SHA.
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA" || { echo "::error::Checked out $(git rev-parse HEAD), expected $RELEASE_SHA"; exit 1; }
          bash build/verify-release.sh "$TAG" "$RELEASE_SHA"

      - uses: shivammathur/setup-php@v2
        if: env.SKIP == ''
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: mbstring
          coverage: none

      - name: Build ZIP
        if: env.SKIP == ''
        run: bash build/release.sh

      - name: Extract release notes from CHANGELOG.md
        if: env.SKIP == ''
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "Siehe CHANGELOG.md" > release-notes.md

      - name: Publish release
        if: env.SKIP == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # The tag must still point at the verified commit (it could have been moved meanwhile).
            remote="$(git ls-remote origin "refs/tags/${TAG}^{}" | cut -f1)"
            [ -n "$remote" ] || remote="$(git ls-remote origin "refs/tags/${TAG}" | cut -f1)"
            test "$remote" = "$RELEASE_SHA" || { echo "::error::Tag ${TAG} now points to ${remote:-nothing}, verified ${RELEASE_SHA}"; exit 1; }
            target_args=(--verify-tag)
          else
            target_args=(--target "$RELEASE_SHA")
          fi
          gh release create "$TAG" build/dist/pass-captain.zip \
            --title "Pass Captain ${TAG}" \
            --notes-file release-notes.md \
            "${target_args[@]}"
