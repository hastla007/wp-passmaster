name: Release

# Pushing a tag like v1.0.0 builds the plugin ZIP and publishes a GitHub release
# with the matching CHANGELOG section as release notes.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: mbstring
          coverage: none

      - name: Check plugin version matches the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "Version: ${version}\$" wp-pass-captain.php || { echo "Plugin header version does not match tag ${GITHUB_REF_NAME}"; exit 1; }
          grep -q "'WPCAP_VERSION', '${version}'" wp-pass-captain.php || { echo "WPCAP_VERSION does not match tag ${GITHUB_REF_NAME}"; exit 1; }

      - name: Build ZIP
        run: bash build/release.sh

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "Siehe CHANGELOG.md" > release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/dist/wp-pass-captain.zip \
            --title "WP Pass Captain ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
