name: Release

# Publishes a GitHub release with the plugin ZIP and the matching CHANGELOG section:
# - on a pushed tag like v1.0.0,
# - after the CI workflow ("WordPress plugin checks") succeeded for a push to main, for
#   v<plugin version>, unless that release exists already; the tag is then created on exactly
#   the commit CI tested (workflow_run head_sha),
# - on manual runs from main (workflow_dispatch).
#
# Release gate (build/verify-release.sh), for every trigger, before anything is built: the commit
# must be on main (ancestor of origin/main), the CI workflow (ci.yml) must have succeeded for
# exactly that commit (queried via the Actions API; running CI is waited for), and the tag must
# match the plugin header Version, WPCAP_VERSION and the readme.txt Stable tag.
# Then build/check-versions.sh (CHANGELOG, composer.json, requirements), a reproducible build whose
# sha256 must equal the ZIP the CI run tested, and the release gets pass-captain.zip plus
# pass-captain.zip.sha256 (verification: docs/COMPATIBILITY.md, "Release-Artefakt prüfen").
# Job "attest" then signs a build provenance attestation for exactly that ZIP (public repository, or
# repository variable WPCAP_ATTEST=1 where the plan supports attestations for private repositories).
#
# Credentials (A653): the checkout does not persist the token in .git/config; only the three steps that
# talk to origin (fetch main, verify-release.sh, tag check) get it through GIT_CONFIG_* for that step, so
# the build steps (Composer, WP-CLI, build scripts) cannot read it from the repository.
on:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows: ['WordPress plugin checks']
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Least privilege: nothing by default, the release job gets what it needs.
permissions: {}

# Never publish two releases at the same time (e.g. tag push and CI completion overlapping).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Tags and manual runs from main; for CI runs only successful pushes to main (not PRs).
    if: >-
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write # create the release (and the tag for CI-triggered runs)
      actions: read # read CI workflow runs for the release commit
    outputs:
      published: ${{ steps.publish.outputs.published }}
      sha256: ${{ steps.publish.outputs.sha256 }}
    env:
      # The commit to release: the one CI tested for workflow_run, else the triggering commit.
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The token is not left in .git/config; steps that fetch from origin pass it per step (see top).
          persist-credentials: false
          ref: ${{ env.RELEASE_SHA }}
          # Full history so the ancestry check against origin/main works.
          fetch-depth: 0

      # Tag pushes and manual runs: only commits that are on main and passed CI are released
      # (the workflow_run path is gated by the successful CI run on main itself; build/verify-release.sh
      # below checks the same again for every trigger).
      - name: Release guard (commit on main, CI green)
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Token for git only in this step (persist-credentials: false), masked in the log.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"
          git fetch --no-tags origin main
          bash build/release-guard.sh "$RELEASE_SHA" origin/main "WordPress plugin checks"

      - name: Determine tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "SKIP=" >> "$GITHUB_ENV"
          else
            version="$(sed -n 's/^ \* Version: *//p' pass-captain.php | head -n1)"
            test -n "$version" || { echo "No plugin version found"; exit 1; }
            echo "TAG=v${version}" >> "$GITHUB_ENV"
            # Already released (e.g. a later push without version bump): nothing to do.
            if gh release view "v${version}" >/dev/null 2>&1; then echo "SKIP=1" >> "$GITHUB_ENV"; echo "Release v${version} exists"; else echo "SKIP=" >> "$GITHUB_ENV"; fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify release commit (on main, CI passed for this SHA, versions match the tag)
        if: env.SKIP == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Token for git only in this step (persist-credentials: false), masked in the log.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"
          # The checkout is the release commit itself; HEAD must be exactly RELEASE_SHA.
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA" || { echo "::error::Checked out $(git rev-parse HEAD), expected $RELEASE_SHA"; exit 1; }
          bash build/verify-release.sh "$TAG" "$RELEASE_SHA"

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: env.SKIP == ''
        with:
          php-version: '8.5'
          # Same exact Composer version as ci.yml (COMPOSER_VERSION), so the ZIP is byte-identical.
          # wp-cli: script translations (wp i18n make-json) in build/release.sh.
          tools: composer:2.8.12, wp-cli
          extensions: mbstring
          coverage: none

      - name: Release gate – all translations complete
        if: env.SKIP == ''
        run: php tests/i18n-check.php

      - name: Release gate – manual acceptance record complete (docs/RELEASE.md)
        if: env.SKIP == ''
        run: bash build/release-acceptance.sh "${TAG#v}"

      - name: Version, changelog and requirement consistency
        if: env.SKIP == ''
        run: bash build/check-versions.sh "$TAG"

      - name: Build ZIP (reproducible, writes pass-captain.zip.sha256)
        if: env.SKIP == ''
        run: bash build/release.sh

      - name: Compare with the ZIP CI built and tested for this commit
        if: env.SKIP == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" -f head_sha="$RELEASE_SHA" -f status=success -f per_page=1 --jq '.workflow_runs[0].id // empty')"
          test -n "$run_id" || { echo "::error::No successful CI run with an artifact for ${RELEASE_SHA}"; exit 1; }
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name pass-captain --dir "$RUNNER_TEMP/ci-artifact"
          ci="$(sha256sum "$RUNNER_TEMP/ci-artifact/pass-captain.zip" | cut -d' ' -f1)"
          ours="$(cut -d' ' -f1 build/dist/pass-captain.zip.sha256)"
          echo "CI run ${run_id}: ${ci}"; echo "release build:  ${ours}"
          test "$ci" = "$ours" || { echo "::error::Release ZIP differs from the ZIP CI tested for ${RELEASE_SHA} (build not reproducible)"; exit 1; }

      - name: Extract release notes from CHANGELOG.md
        if: env.SKIP == ''
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "Siehe CHANGELOG.md" > release-notes.md

      - name: Publish release
        id: publish
        if: env.SKIP == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Token for git only in this step (persist-credentials: false), masked in the log.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # The tag must still point at the verified commit (it could have been moved meanwhile).
            remote="$(git ls-remote origin "refs/tags/${TAG}^{}" | cut -f1)"
            [ -n "$remote" ] || remote="$(git ls-remote origin "refs/tags/${TAG}" | cut -f1)"
            test "$remote" = "$RELEASE_SHA" || { echo "::error::Tag ${TAG} now points to ${remote:-nothing}, verified ${RELEASE_SHA}"; exit 1; }
            target_args=(--verify-tag)
          else
            target_args=(--target "$RELEASE_SHA")
          fi
          gh release create "$TAG" build/dist/pass-captain.zip build/dist/pass-captain.zip.sha256 build/dist/build-info.txt \
            --title "Pass Captain ${TAG}" \
            --notes-file release-notes.md \
            "${target_args[@]}"
          echo "published=1" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 build/dist/pass-captain.zip.sha256)" >> "$GITHUB_OUTPUT"

      # Handed to the attest job (which has the signing permissions, this job does not).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.publish.outputs.published == '1'
        with:
          name: release-zip
          path: |
            build/dist/pass-captain.zip
            build/dist/pass-captain.zip.sha256
          retention-days: 7

  attest:
    # Build provenance (SLSA, Sigstore) for the published ZIP: `gh attestation verify pass-captain.zip
    # --repo hastla007/wp-passmaster` (docs/COMPATIBILITY.md). Separate job so only this one may mint an
    # OIDC token; it runs no build code. Attestations for private repositories need a plan that supports
    # them: there set the repository variable WPCAP_ATTEST=1. The published .sha256 is always there.
    needs: [release]
    if: >-
      needs.release.outputs.published == '1' &&
      (!github.event.repository.private || vars.WPCAP_ATTEST == '1')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # Sigstore signing certificate
      attestations: write # store the attestation
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-zip
          path: dist
      - name: ZIP is the one the release published (checksum)
        env:
          EXPECTED: ${{ needs.release.outputs.sha256 }}
        run: |
          (cd dist && sha256sum -c pass-captain.zip.sha256)
          test "$(cut -d' ' -f1 dist/pass-captain.zip.sha256)" = "$EXPECTED"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/pass-captain.zip
