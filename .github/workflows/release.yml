name: Release

# Publishes a GitHub release with the plugin ZIP and the matching CHANGELOG section:
# - on a pushed tag like v1.0.0,
# - on every push to main (and manual runs there) for v<plugin version>, unless that
#   release exists already; the tag is then created on that commit.
on:
  push:
    tags:
      - 'v*'
    # Every push to main publishes the release for the plugin version if it does not exist yet.
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Manual runs only from main, so a release always matches merged code.
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "SKIP=" >> "$GITHUB_ENV"
          else
            version="$(sed -n 's/^ \* Version: *//p' wp-pass-captain.php | head -n1)"
            test -n "$version" || { echo "No plugin version found"; exit 1; }
            echo "TAG=v${version}" >> "$GITHUB_ENV"
            # Already released (e.g. a later push without version bump): nothing to do.
            if gh release view "v${version}" >/dev/null 2>&1; then echo "SKIP=1" >> "$GITHUB_ENV"; echo "Release v${version} exists"; else echo "SKIP=" >> "$GITHUB_ENV"; fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: shivammathur/setup-php@v2
        if: env.SKIP == ''
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: mbstring
          coverage: none

      - name: Check plugin version matches the tag
        if: env.SKIP == ''
        run: |
          version="${TAG#v}"
          grep -q "Version: ${version}\$" wp-pass-captain.php || { echo "Plugin header version does not match tag ${TAG}"; exit 1; }
          grep -q "'WPCAP_VERSION', '${version}'" wp-pass-captain.php || { echo "WPCAP_VERSION does not match tag ${TAG}"; exit 1; }

      - name: Build ZIP
        if: env.SKIP == ''
        run: bash build/release.sh

      - name: Extract release notes from CHANGELOG.md
        if: env.SKIP == ''
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "Siehe CHANGELOG.md" > release-notes.md

      - name: Publish release
        if: env.SKIP == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then target_args=(--verify-tag); else target_args=(--target "$GITHUB_SHA"); fi
          gh release create "$TAG" build/dist/wp-pass-captain.zip \
            --title "WP Pass Captain ${TAG}" \
            --notes-file release-notes.md \
            "${target_args[@]}"
