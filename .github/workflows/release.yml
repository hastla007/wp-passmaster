name: Release

# Publishes a GitHub release with the plugin ZIP and the matching CHANGELOG section:
# - on a pushed tag like v1.0.0,
# - after the CI workflow ("WordPress plugin checks") succeeded for a push to main, for
#   v<plugin version>, unless that release exists already; the tag is then created on exactly
#   the commit CI tested (workflow_run head_sha),
# - on manual runs from main (workflow_dispatch).
on:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows: ['WordPress plugin checks']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never publish two releases at the same time (e.g. tag push and CI completion overlapping).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Tags and manual runs from main; for CI runs only successful pushes to main (not PRs).
    if: >-
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      # The commit to release: the one CI tested for workflow_run, else the triggering commit.
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      # Tag pushes and manual runs: only commits that are on main and passed CI are released
      # (the workflow_run path is gated by the successful CI run on main itself).
      - name: Release guard (commit on main, CI green)
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main
          bash build/release-guard.sh "$RELEASE_SHA" origin/main "WordPress plugin checks"

      - name: Determine tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "SKIP=" >> "$GITHUB_ENV"
          else
            version="$(sed -n 's/^ \* Version: *//p' wp-pass-captain.php | head -n1)"
            test -n "$version" || { echo "No plugin version found"; exit 1; }
            echo "TAG=v${version}" >> "$GITHUB_ENV"
            # Already released (e.g. a later push without version bump): nothing to do.
            if gh release view "v${version}" >/dev/null 2>&1; then echo "SKIP=1" >> "$GITHUB_ENV"; echo "Release v${version} exists"; else echo "SKIP=" >> "$GITHUB_ENV"; fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: shivammathur/setup-php@v2
        if: env.SKIP == ''
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: mbstring
          coverage: none

      - name: Release gate – manual acceptance record complete (docs/RELEASE.md)
        if: env.SKIP == ''
        run: bash build/release-acceptance.sh "${TAG#v}"

      - name: Check plugin version matches the tag
        if: env.SKIP == ''
        run: |
          version="${TAG#v}"
          grep -q "Version: ${version}\$" wp-pass-captain.php || { echo "Plugin header version does not match tag ${TAG}"; exit 1; }
          grep -q "'WPCAP_VERSION', '${version}'" wp-pass-captain.php || { echo "WPCAP_VERSION does not match tag ${TAG}"; exit 1; }

      - name: Build ZIP
        if: env.SKIP == ''
        run: bash build/release.sh

      - name: Extract release notes from CHANGELOG.md
        if: env.SKIP == ''
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "Siehe CHANGELOG.md" > release-notes.md

      - name: Publish release
        if: env.SKIP == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then target_args=(--verify-tag); else target_args=(--target "$RELEASE_SHA"); fi
          gh release create "$TAG" build/dist/wp-pass-captain.zip build/dist/wp-pass-captain.zip.sha256 build/dist/build-info.txt \
            --title "WP Pass Captain ${TAG}" \
            --notes-file release-notes.md \
            "${target_args[@]}"
