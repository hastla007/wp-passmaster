name: WordPress version matrix

# A125: activation, deactivation, reactivation, uninstall (with/without data removal), admin pages
# and REST in real WordPress installs, plus the upgrade/rollback/restore drill against the previous
# release (tests/restore/drill.sh). Runs on every push/PR and weekly against the newest WordPress.
on:
  push:
  pull_request:
  schedule:
    - cron: '41 4 * * 2'
  workflow_dispatch:

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { wp: '6.4', php: '8.2' }   # minimum supported (Requires at least)
          - { wp: '6.8', php: '8.3' }
          - { wp: 'latest', php: '8.4' }
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: wp
          MARIADB_USER: wp
          MARIADB_PASSWORD: wp
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2, wp-cli
          extensions: mbstring, mysqli, gd, zip, sodium, curl
          coverage: none
      - name: Plugin dependencies
        run: composer install --no-dev --no-interaction --prefer-dist
      - name: Install WordPress ${{ matrix.wp }}
        run: |
          mkdir -p "$RUNNER_TEMP/wp" && cd "$RUNNER_TEMP/wp"
          wp core download --version=${{ matrix.wp }} --locale=en_US
          wp config create --dbname=wp --dbuser=wp --dbpass=wp --dbhost=127.0.0.1
          wp config set AUTOMATIC_UPDATER_DISABLED true --raw   # pinned version: no background updates mid-test
          wp config set WP_AUTO_UPDATE_CORE false --raw
          wp core install --url=http://localhost:8080 --title=Matrix --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email
          echo "WordPress $(wp core version)"
          (PHP_CLI_SERVER_WORKERS=4 nohup php -S localhost:8080 >/dev/null 2>&1 &)
      - name: Lifecycle (activate, deactivate, reactivate, uninstall, admin pages, REST)
        env:
          WPCAP_LIFECYCLE_HTTP: '1'
        run: bash tests/wp-matrix/lifecycle.sh "$RUNNER_TEMP/wp" "$GITHUB_WORKSPACE"
      - name: Build the previous release (old) and this commit (new)
        run: |
          prev="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          echo "Previous release: $prev"
          # The previous release may still carry the old folder name (renamed for WordPress.org): use whatever ZIP it built.
          rm -rf build/dist && WPCAP_BUILD_REF="$prev" bash build/release.sh && cp build/dist/*.zip "$RUNNER_TEMP/old.zip"
          mkdir -p "$RUNNER_TEMP/old" && unzip -q "$RUNNER_TEMP/old.zip" -d "$RUNNER_TEMP/old"
          echo "OLD_PLUGIN_DIR=$(ls -d "$RUNNER_TEMP"/old/*/ | head -n1)" >> "$GITHUB_ENV"
          rm -rf build/dist && bash build/release.sh && mkdir -p "$RUNNER_TEMP/new" && unzip -q build/dist/pass-captain.zip -d "$RUNNER_TEMP/new"
      - name: Release ZIP installed in a fresh WordPress ${{ matrix.wp }} (contents, install, activate, uninstall)
        # A178: the built artefact itself, not the checkout; fails on development files in the ZIP.
        env:
          WPCAP_ZIP_WP_VERSION: ${{ matrix.wp }}
        run: bash tests/wp-matrix/zip-install.sh build/dist/pass-captain.zip "$RUNNER_TEMP/zip-install"
      - name: Upgrade / rollback / restore drill with real data
        run: |
          mkdir -p "$RUNNER_TEMP/drill"
          bash tests/restore/drill.sh "$RUNNER_TEMP/wp" "${OLD_PLUGIN_DIR%/}" "$RUNNER_TEMP/new/pass-captain" "$RUNNER_TEMP/drill"
      - name: Switch from the previous release in a real site (rename to pass-captain, old copy taken over)
        env:
          WPCAP_ZIP_WP_VERSION: ${{ matrix.wp }}
        run: bash tests/wp-matrix/rename-takeover.sh "$RUNNER_TEMP/old.zip" build/dist/pass-captain.zip "$RUNNER_TEMP/rename"

  woocommerce:
    # A127: the WooCommerce adapter against installed WooCommerce versions, HPOS and posts storage.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wc: ['8.2.0', 'latest']   # "WC requires at least" and newest
        storage: ['hpos', 'posts']
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: wp
          MARIADB_USER: wp
          MARIADB_PASSWORD: wp
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2, wp-cli
          extensions: mbstring, mysqli, gd, zip, sodium, curl, intl
          coverage: none
      - name: Plugin dependencies
        run: composer install --no-dev --no-interaction --prefer-dist
      - name: Install WordPress, WooCommerce ${{ matrix.wc }} and the plugin
        run: |
          mkdir -p "$RUNNER_TEMP/wp" && cd "$RUNNER_TEMP/wp"
          wp core download --locale=en_US
          wp config create --dbname=wp --dbuser=wp --dbpass=wp --dbhost=127.0.0.1
          wp config set AUTOMATIC_UPDATER_DISABLED true --raw   # pinned version: no background updates mid-test
          wp config set WP_AUTO_UPDATE_CORE false --raw
          wp core install --url=http://localhost:8080 --title=Woo --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email
          if [ "${{ matrix.wc }}" = "latest" ]; then wp plugin install woocommerce --activate; else wp plugin install woocommerce --version=${{ matrix.wc }} --activate; fi
          wp option update woocommerce_currency EUR
          ln -s "$GITHUB_WORKSPACE" wp-content/plugins/pass-captain
          wp plugin activate pass-captain
          echo "WooCommerce $(wp plugin get woocommerce --field=version)"
      - name: Order storage ${{ matrix.storage }}
        run: |
          cd "$RUNNER_TEMP/wp"
          if [ "${{ matrix.storage }}" = "hpos" ]; then
            wp option update woocommerce_custom_orders_table_enabled yes
          else
            wp option update woocommerce_custom_orders_table_enabled no
          fi
          wp option update woocommerce_custom_orders_table_data_sync_enabled no
      - name: WooCommerce adapter smoke test (hold, payment, refund, cancel, sold out)
        run: wp --path="$RUNNER_TEMP/wp" eval-file tests/wp-matrix/woocommerce-smoke.php

  accessibility:
    # A155: axe-core (WCAG 2.2 A/AA, fails on serious/critical) and the keyboard walk-through against a
    # real WordPress install with the plugin (public checkout, ticket page, portal, waitlist, scanner, admin).
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: wp
          MARIADB_USER: wp
          MARIADB_PASSWORD: wp
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2, wp-cli
          extensions: mbstring, mysqli, gd, zip, sodium, curl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Plugin dependencies
        run: composer install --no-dev --no-interaction --prefer-dist
      - name: Install WordPress (German) with the plugin
        run: |
          mkdir -p "$RUNNER_TEMP/wp" && cd "$RUNNER_TEMP/wp"
          wp core download --locale=de_DE
          wp config create --dbname=wp --dbuser=wp --dbpass=wp --dbhost=127.0.0.1
          wp config set AUTOMATIC_UPDATER_DISABLED true --raw   # pinned version: no background updates mid-test
          wp config set WP_AUTO_UPDATE_CORE false --raw
          wp core install --url=http://localhost:8080 --title=A11y --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email
          wp language core install de_DE --activate || true
          ln -s "$GITHUB_WORKSPACE" wp-content/plugins/pass-captain
          wp plugin activate pass-captain
          wp rewrite structure '/%postname%/'
          (PHP_CLI_SERVER_WORKERS=4 nohup php -S localhost:8080 >/dev/null 2>&1 &)
      - name: Install axe-core and Playwright
        run: cd tests/a11y && npm ci && npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: axe-core (fails on serious or critical findings)
        env:
          WPCAP_A11Y_WP_PATH: ${{ runner.temp }}/wp
          WPCAP_A11Y_BASE: http://localhost:8080
          WPCAP_A11Y_USER: admin
          WPCAP_A11Y_PASS: admin
        run: cd tests/a11y && node run.js --fail-on=serious
      - name: Keyboard walk-through
        env:
          WPCAP_A11Y_WP_PATH: ${{ runner.temp }}/wp
          WPCAP_A11Y_BASE: http://localhost:8080
          WPCAP_A11Y_USER: admin
          WPCAP_A11Y_PASS: admin
        run: cd tests/a11y && node keyboard.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-report
          path: tests/a11y/report/
