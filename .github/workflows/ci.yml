name: WordPress plugin checks

on:
  # Branches are checked through their pull request only; push runs only on main (no duplicate runs).
  push:
    branches: [main]
  pull_request:

# A new push to a pull request supersedes its running check; main keeps every run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Exact Composer version: the vendor/composer files in the ZIP depend on it (reproducible build).
  COMPOSER_VERSION: '2.8.12'

jobs:
  php:
    runs-on: ubuntu-latest
    # MINVER-1: PHP 8.5 is the minimum; 8.6 runs as experimental (failures shown, not blocking).
    continue-on-error: ${{ matrix.php == '8.6' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.6']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2, wp-cli
          extensions: mbstring
          coverage: none
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Install dependencies (no Composer scripts or plugins, A653)
        run: composer install --no-interaction --prefer-dist --no-scripts --no-plugins
      - name: PHP syntax checks
        run: find . -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: SQL table prefixes, no hard-coded wp_, no direct WooCommerce order table queries (docs/TESTING.md)
        run: php tests/sql-prefix-check.php --self-test
      - name: No byte-wise substr() on text – UTF-8 safe truncation via Text::cut() (A478, docs/TESTING.md)
        run: php tests/utf8-substr-check.php --self-test
      # PHPCS (against phpcs-baseline.json) and the Composer audit run in the "static" job below.
      - name: Secret scan of all tracked files
        run: php tests/secret-scan.php
      - name: JavaScript syntax checks
        run: for f in $(git ls-files "assets/*.js" "src/*.js" | grep -v "^assets/vendor/"); do node --check "$f" || exit 1; done
      - name: Translations consistent, .pot and .mo up to date (completeness is a release gate)
        run: |
          wp i18n make-pot . "$RUNNER_TEMP/fresh.pot" --domain=pass-captain --exclude=vendor,vendor-prefixed,tests,build,.claude,node_modules --skip-audit --skip-theme-json
          php tests/i18n-check.php --allow-incomplete --fresh-pot="$RUNNER_TEMP/fresh.pot"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: JavaScript lint (ESLint, all own scripts) and unit tests (node:test, tests/js)
        run: npm ci --no-audit --no-fund && npm run lint:js && npm run test:js
      - name: npm security audit (high/critical fail)
        run: npm audit --audit-level=high && (cd tests/a11y && npm audit --audit-level=high)
      - name: Offline scanner translations
        run: node tests/offline-scanner-i18n.js
      - name: Release metadata consistency (version, readme, composer, changelogs, doc links)
        run: php tests/consistency.php
      - name: Release guard tests
        run: bash tests/release-guard.sh
      - name: Release acceptance gate tests
        run: bash tests/release-acceptance.sh

  static:
    # Blocking quality gates (docs/TESTING.md, "Statische Analyse"): coding standard and PHPStan with
    # frozen baselines (new findings fail), known vulnerabilities in Composer packages, version consistency.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          tools: composer:${{ env.COMPOSER_VERSION }}
          extensions: mbstring
          coverage: none
      - name: Install dependencies (incl. dev tools; no Composer scripts or plugins, A653)
        # PHPCS standards are registered in phpcs.xml.dist, the PHPStan extension in phpstan.neon.dist.
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
      - name: Prefixed QR libraries match composer.lock (vendor-prefixed/, Strauss PHAR pinned by SHA-256; A103)
        run: bash build/prefix-vendor.sh --check
      - name: Version and requirement consistency
        run: bash build/check-versions.sh
      - name: PHP_CodeSniffer (WordPress Coding Standards, PHPCompatibilityWP) against phpcs-baseline.json
        run: php build/phpcs-baseline.php
      - name: PHPStan (level 5, WordPress + WooCommerce stubs) against phpstan-baseline.neon
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G --error-format=github
      - name: Composer security audit (runtime and dev packages)
        run: composer audit --locked --no-interaction
      - name: Translations complete (POT vs. PO, placeholders, compiled MO)
        run: php build/check-i18n.php

  license-guard:
    # Decision 13.11.2026 (TODO A2): the core plugin stays free for WordPress.org. Fails as soon as licence
    # client, entitlement checks, an "Update URI" header or own update hooks appear in the shipped files.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
      - name: Guard self-test (every rule detects a planted sample)
        run: php tests/guard/no-license-code.php --self-test
      - name: No licence or self-update code in the core plugin
        run: php tests/guard/no-license-code.php
      - name: No licence or updater code in the shipped core plugin (second guard, docs/FREE-PREMIUM.md)
        run: php tests/license-guard.php --self-test

  secrets:
    # Secret scanning of the git history (gitleaks, rules + test allowlists in .gitleaks.toml) and,
    # for pull requests, review of added/changed dependencies against known vulnerabilities.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks (git history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Required by gitleaks-action for repositories owned by an organisation (free key on gitleaks.io).
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - name: Dependency review (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate

  integration:
    # DB integration suite and load smoke test on every supported PHP version x database server
    # (support matrix: docs/COMPATIBILITY.md). Entries with experimental: true are tested but not
    # released yet; their failures are shown but do not block.
    name: integration (PHP ${{ matrix.php }}, ${{ matrix.db.name }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.db.experimental }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
        db:
          - { name: 'MariaDB 12.3', image: 'mariadb:12.3', health: 'healthcheck.sh --connect --innodb_initialized', experimental: false }
          - { name: 'MySQL 9.7', image: 'mysql:9.7', health: 'mysqladmin ping -h 127.0.0.1 -uroot -proot', experimental: false }
        # A175/A176: newest PHP and further MariaDB LTS versions (support policy in docs/OPERATIONS.md,
        # "Datenbank- und PHP-Freigaben").
        include:
          - php: '8.6'
            db: { name: 'MariaDB 12.3', image: 'mariadb:12.3', health: 'healthcheck.sh --connect --innodb_initialized', experimental: true }
          - php: '8.6'
            db: { name: 'MySQL 9.7', image: 'mysql:9.7', health: 'mysqladmin ping -h 127.0.0.1 -uroot -proot', experimental: true }
    services:
      db:
        image: ${{ matrix.db.image }}
        env:
          # MYSQL_* is understood by both the mysql and the mariadb images; MARIADB_* for newer mariadb images.
          MARIADB_DATABASE: wp
          MARIADB_USER: wp
          MARIADB_PASSWORD: wp
          MARIADB_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp
          MYSQL_USER: wp
          MYSQL_PASSWORD: wp
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.db.health }}"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0   # tags v* and history: the upgrade tests install every previous version
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, mysqli, gd, zip, sodium, openssl, curl
          tools: wp-cli
          coverage: none
      - name: Server versions
        run: php -r 'echo "PHP ", PHP_VERSION, PHP_EOL; $m = new mysqli("127.0.0.1", "wp", "wp", "wp"); echo "DB  ", $m->server_info, PHP_EOL;'
      - name: Shipped Composer dependencies (as in the release ZIP; the QR encoder is the committed vendor-prefixed/ copy)
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
      - name: Integration tests (orders, WooCommerce adapter, modules)
        env:
          WPCAP_TEST_DB_HOST: 127.0.0.1
        run: php tests/integration/run.php
      - name: Upgrade tests from every previous version (real dbDelta, abort, parallel; docs/TESTING.md)
        env:
          WPCAP_TEST_DB_HOST: 127.0.0.1
        run: php tests/upgrade/run.php
      - name: Test runtime sanitisers equal WordPress' own (A498; uses the WordPress download of the upgrade tests)
        run: php tests/integration/sanitize-parity.php --require
      - name: Concurrency/load smoke test (200 buyers, 8 scanners, 100 webhook deliveries; ~10 s)
        # Regression test for the check-in deadlock (false "admitted" responses, see docs/TESTING.md).
        env:
          WPCAP_TEST_DB_HOST: 127.0.0.1
        run: php tests/load/run.php --profile=ci
      - name: Load smoke under READ COMMITTED sessions (checkout + late payments + seats; no overselling)
        # Sites tuned to READ COMMITTED must not oversell: the plugin forces REPEATABLE READ per transaction.
        env:
          WPCAP_TEST_DB_HOST: 127.0.0.1
        run: |
          php tests/load/run.php --profile=ci --scenario=mixed --isolation=READ-COMMITTED
          php tests/load/run.php --profile=ci --scenario=seats --isolation=READ-COMMITTED

  browser:
    # Release gates in the browser (docs/RELEASE.md): Playwright E2E (checkout, order portal, web scanner, offline
    # PWA incl. offline check-out, refund and service rebooking flows, A321 real-condition checks of every buyer
    # widget – all tests/e2e/*.test.js, no extra services) in Chromium, Firefox and WebKit, plus mobile emulation (Pixel 7 on Chromium, iPhone 14 on WebKit) for
    # checkout, portal and offline-scanner pairing. The axe accessibility gate (all admin screens + keyboard
    # walkthrough) and the WooCommerce Blocks E2E run only in the Chromium desktop leg.
    name: browser (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: 'chromium', slug: 'chromium', browser: 'chromium', a11y: true, woo: true }
          - { label: 'firefox', slug: 'firefox', browser: 'firefox' }
          - { label: 'webkit', slug: 'webkit', browser: 'webkit' }
          - { label: 'Pixel 7, chromium', slug: 'pixel-7', browser: 'chromium', device: 'Pixel 7', files: 'checkout.test.js portal.test.js offline-scanner.test.js' }
          - { label: 'iPhone 14, webkit', slug: 'iphone-14', browser: 'webkit', device: 'iPhone 14', files: 'checkout.test.js portal.test.js offline-scanner.test.js' }
    env:
      PLAYWRIGHT_VERSION: '1.63.0'
    services:
      db:
        image: mariadb:12.3
        env:
          MYSQL_DATABASE: wp_browser
          MYSQL_USER: wp
          MYSQL_PASSWORD: wp
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: mbstring, mysqli, gd, zip, sodium, openssl
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install Playwright ${{ env.PLAYWRIGHT_VERSION }} + ${{ matrix.browser }}
        run: |
          cd tests/a11y
          npm ci --no-audit --no-fund
          npm i --no-save --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps ${{ matrix.browser }}
          echo "NODE_PATH=$PWD/node_modules" >> "$GITHUB_ENV"
      - name: Download WooCommerce (Blocks checkout E2E)
        if: matrix.woo
        # Pinned to the "WC tested up to" version (plugin header); the GitHub release ZIP is the same package.
        run: curl -fsSL --retry 3 https://github.com/woocommerce/woocommerce/releases/download/11.3.0/woocommerce.zip -o "$RUNNER_TEMP/woocommerce.zip"
      - name: Accessibility gate (Chromium)
        if: matrix.a11y
        env:
          WPCAP_DB_HOST: 127.0.0.1
          WPCAP_DB_NAME: wp_browser
        run: tests/ci/browser-tests.sh a11y
      - name: Browser E2E (${{ matrix.label }})
        env:
          WPCAP_DB_HOST: 127.0.0.1
          WPCAP_DB_NAME: wp_browser
          WPCAP_E2E_BROWSER: ${{ matrix.browser }}
          WPCAP_E2E_DEVICE: ${{ matrix.device }}
        run: |
          if [ -n "${{ matrix.woo }}" ]; then export WPCAP_WOO_ZIP="$RUNNER_TEMP/woocommerce.zip"; fi
          # shellcheck disable=SC2086 # word splitting intended: list of test files (empty = all)
          tests/ci/browser-tests.sh e2e ${{ matrix.files }}
      - name: Upload E2E failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-artifacts-${{ matrix.slug }}
          path: tests/e2e/artifacts/
          if-no-files-found: ignore

  pwa:
    # A120: automated part of the PWA acceptance (installability, service worker, offline start).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install Playwright (Chromium)
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: PWA installability and offline start (Chromium desktop + Android emulation)
        run: node tests/pwa/installability.js

  package:
    runs-on: ubuntu-latest
    needs: [php, static, integration, license-guard, secrets, browser, pwa]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          # wp-cli: script translations (wp i18n make-json) in build/release.sh.
          tools: composer:${{ env.COMPOSER_VERSION }}, wp-cli
          extensions: mbstring
          coverage: none
      - name: Reproducible build test (two builds at different times, checksum, build-info.txt, file times)
        run: bash tests/reproducible-build.sh
      - name: Build installable plugin ZIP
        run: bash build/release.sh
      - name: Reproducible build (second build from a clean Composer cache must be byte-identical)
        run: |
          cp build/dist/pass-captain.zip "$RUNNER_TEMP/first.zip"
          composer clear-cache
          bash build/release.sh
          first="$(sha256sum "$RUNNER_TEMP/first.zip" | cut -d' ' -f1)"
          second="$(sha256sum build/dist/pass-captain.zip | cut -d' ' -f1)"
          echo "first:  $first"; echo "second: $second"
          if [ "$first" != "$second" ]; then
            echo "::error::ZIP build is not reproducible"
            diff <(unzip -Zv "$RUNNER_TEMP/first.zip") <(unzip -Zv build/dist/pass-captain.zip) | head -50 || true
            exit 1
          fi
          (cd build/dist && sha256sum -c pass-captain.zip.sha256)
      - name: Package gate - secret scan of every file in the ZIP, including bundled vendor code
        run: php tests/secret-scan.php --zip=build/dist/pass-captain.zip
      - name: Package contents (no tests/dev files, autoloader and assets present, no embedded keys)
        run: WPCAP_IT_STATIC_ONLY=1 bash build/ci-install-test.sh build/dist/pass-captain.zip
      - name: No licence or self-update code in the built package
        run: |
          rm -rf build/unpacked && mkdir -p build/unpacked
          unzip -q build/dist/pass-captain.zip -d build/unpacked
          php tests/guard/no-license-code.php build/unpacked/pass-captain
      - name: Secret scan of the built package (gitleaks)
        run: |
          v=8.28.0
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir --no-banner --redact --config .gitleaks.toml build/unpacked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pass-captain
          path: |
            build/dist/pass-captain.zip
            build/dist/pass-captain.zip.sha256
            build/dist/build-info.txt

  install-test:
    # The release ZIP in a fresh, real WordPress (WP-CLI), alone and with WooCommerce minimum/latest,
    # HPOS on and off (build/ci-install-test.sh). Every leg ends with the uninstall checks (data kept by default,
    # everything removed with "Daten beim Löschen entfernen"); the "Update from 1.4.0" leg first installs the
    # previous release (built from its release commit), creates data with it and updates to this ZIP.
    name: install-test (PHP ${{ matrix.php }}, ${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: [package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: 'WordPress latest', php: '8.5', wc: '' }
          - { label: 'WordPress 7.0 (minimum)', php: '8.5', wc: '', wp: '7.0' }
          - { label: 'WooCommerce latest', php: '8.5', wc: 'latest' }
          - { label: 'WooCommerce 11.2.2 (minimum)', php: '8.5', wc: '11.2.2' }
          # Release 1.4.0 (#18), the last version published as wp-pass-captain/wp-pass-captain.php.
          - { label: 'Update from 1.4.0', php: '8.5', wc: '', upgrade_from: '90c972ab681b32254887a945a11e17325e0a801c' }
          # Multisite (build/ci-multisite-test.sh): 30 sites, network activation (25 now, the rest via
          # wpcap_run_upgrade), site deletion, uninstall with mixed opt-in.
          - { label: 'Multisite (30 sites)', php: '8.5', wc: '', multisite: '1' }
    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_DATABASE: wp
          MARIADB_USER: wp
          MARIADB_PASSWORD: wp
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The update leg builds the previous release from its commit.
          fetch-depth: ${{ matrix.upgrade_from && '0' || '1' }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer:${{ env.COMPOSER_VERSION }}
          extensions: mbstring, mysqli, gd, zip, sodium, openssl, intl
          coverage: none
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pass-captain
          path: build/dist
      - name: Install and activate the release ZIP, smoke check, update path, uninstall
        env:
          WPCAP_IT_DB_HOST: 127.0.0.1
          WPCAP_IT_WP_VERSION: ${{ matrix.wp || 'latest' }}
          WPCAP_IT_WC_VERSION: ${{ matrix.wc }}
          WPCAP_IT_UPGRADE_FROM: ${{ matrix.upgrade_from }}
        run: |
          if [ "${{ matrix.multisite }}" = "1" ]; then
            bash build/ci-multisite-test.sh build/dist/pass-captain.zip
          else
            bash build/ci-install-test.sh build/dist/pass-captain.zip
          fi

  plugin-check:
    # WordPress.org Plugin Check (TODO A8), LATEST version, against exactly the release ZIP. Fails on errors
    # that are not in tests/plugin-check/baseline.json (known backlog A305), like the pinned release gate in
    # wp-matrix.yml; this job is the early warning for checks added by new Plugin Check releases.
    runs-on: ubuntu-latest
    needs: [package]
    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_DATABASE: wp
          MARIADB_USER: wp
          MARIADB_PASSWORD: wp
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pass-captain
          path: build/dist
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          tools: wp-cli
          extensions: mbstring, mysqli, zip
          coverage: none
      - name: Throw-away WordPress with the latest Plugin Check and the ZIP
        run: |
          mkdir -p "$RUNNER_TEMP/pcp" && cd "$RUNNER_TEMP/pcp"
          wp core download --locale=en_US
          wp config create --dbname=wp --dbuser=wp --dbpass=wp --dbhost=127.0.0.1
          wp core install --url=http://localhost --title=PCP --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email
          wp plugin install plugin-check --activate
          wp plugin install "$GITHUB_WORKSPACE/build/dist/pass-captain.zip"
      - name: Plugin Check (category plugin_repo), errors outside the baseline fail
        run: |
          wp --path="$RUNNER_TEMP/pcp" plugin check pass-captain --format=json --categories=plugin_repo > "$RUNNER_TEMP/pcp-latest.txt"
          php tests/plugin-check/compare.php "$RUNNER_TEMP/pcp-latest.txt" tests/plugin-check/baseline.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: plugin-check-latest-result
          path: ${{ runner.temp }}/pcp-latest.txt
