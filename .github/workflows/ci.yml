name: WordPress plugin checks

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2, wp-cli
          extensions: mbstring
          coverage: none
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: PHP syntax checks
        run: find . -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHPCS (WordPress security, SQL, i18n, PHP compatibility – fails on errors)
        run: vendor/bin/phpcs -q --report=summary
      - name: Composer security audit (fails on known vulnerabilities, also in dev dependencies)
        run: composer audit --no-interaction
      - name: Secret scan of all tracked files
        run: php tests/secret-scan.php
      - name: JavaScript syntax checks
        run: node --check assets/checkout.js && node --check assets/scanner.js && node --check src/blocks/events/editor.js && node --check assets/offline-scanner/app.js && node --check assets/offline-scanner/i18n.js && node --check assets/offline-scanner/sw.js
      - name: Translations consistent, .pot and .mo up to date (completeness is a release gate)
        run: |
          wp i18n make-pot . "$RUNNER_TEMP/fresh.pot" --domain=pass-captain --exclude=vendor,tests,build,.claude,node_modules --skip-audit --skip-block-json --skip-theme-json
          php tests/i18n-check.php --allow-incomplete --fresh-pot="$RUNNER_TEMP/fresh.pot"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript lint (ESLint, all own scripts) and logic tests
        run: npm ci --no-audit --no-fund && npm run lint:js && npm run test:js
      - name: npm security audit (high/critical fail)
        run: npm audit --audit-level=high && (cd tests/a11y && npm audit --audit-level=high)
      - name: Offline scanner translations
        run: node tests/offline-scanner-i18n.js
      - name: Release metadata consistency (version, readme, composer, changelogs, doc links)
        run: php tests/consistency.php
      - name: Release guard tests
        run: bash tests/release-guard.sh
      - name: Release acceptance gate tests
        run: bash tests/release-acceptance.sh

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A175/A176: every supported PHP version and the oldest/newest supported MySQL and MariaDB
        # (support policy in docs/OPERATIONS.md, "Datenbank- und PHP-Freigaben").
        include:
          - { php: '8.2', db: 'mariadb:10.6' }   # minimum PHP + minimum MariaDB
          - { php: '8.2', db: 'mysql:8.0' }      # minimum PHP + minimum MySQL
          - { php: '8.3', db: 'mariadb:10.11' }
          - { php: '8.3', db: 'mysql:8.4' }
          - { php: '8.4', db: 'mariadb:11.4' }
          - { php: '8.4', db: 'mysql:8.4' }
          - { php: '8.5', db: 'mariadb:11.8' }   # newest PHP + newest MariaDB LTS
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MARIADB_DATABASE: wp
          MARIADB_USER: wp
          MARIADB_PASSWORD: wp
          MARIADB_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp
          MYSQL_USER: wp
          MYSQL_PASSWORD: wp
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot || healthcheck.sh --connect"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, mysqli, gd, zip, sodium, openssl
          coverage: none
      - name: Server versions
        run: php -r 'echo "PHP ", PHP_VERSION, PHP_EOL; $m = new mysqli("127.0.0.1", "wp", "wp", "wp"); echo "DB  ", $m->server_info, PHP_EOL;'
      - name: Orders and WooCommerce adapter integration tests
        env:
          WPCAP_TEST_DB_HOST: 127.0.0.1
        run: php tests/integration/run.php
      - name: Concurrency/load smoke test (200 buyers, 8 scanners, 100 webhook deliveries; ~10 s)
        # Regression test for the check-in deadlock (false "admitted" responses, see docs/TESTING.md).
        env:
          WPCAP_TEST_DB_HOST: 127.0.0.1
        run: php tests/load/run.php --profile=ci

  pwa:
    # A120: automated part of the PWA acceptance (installability, service worker, offline start).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright (Chromium)
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: PWA installability and offline start (Chromium desktop + Android emulation)
        run: node tests/pwa/installability.js

  package:
    runs-on: ubuntu-latest
    needs: [php, integration, pwa]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: mbstring
      - name: Reproducible build (two builds must be byte-identical)
        run: bash tests/reproducible-build.sh
      - name: Build installable plugin ZIP
        run: bash build/release.sh
      - name: Package gate - secret scan of every file in the ZIP, including bundled vendor code
        run: php tests/secret-scan.php --zip=build/dist/pass-captain.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pass-captain
          path: |
            build/dist/pass-captain.zip
            build/dist/pass-captain.zip.sha256
            build/dist/build-info.txt
