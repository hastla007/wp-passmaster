name: WordPress plugin checks

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: mbstring
          coverage: none
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: PHP syntax checks
        run: find . -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax checks
        run: node --check assets/checkout.js && node --check assets/scanner.js && node --check src/blocks/events/editor.js

  license-guard:
    # Decision 13.11.2026 (TODO A2): the core plugin stays free for WordPress.org. Fails as soon as licence
    # client, entitlement checks, an "Update URI" header or own update hooks appear in the shipped files.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Guard self-test (every rule detects a planted sample)
        run: php tests/guard/no-license-code.php --self-test
      - name: No licence or self-update code in the core plugin
        run: php tests/guard/no-license-code.php

  integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: wp
          MARIADB_USER: wp
          MARIADB_PASSWORD: wp
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, mysqli, gd, zip, sodium, openssl
          coverage: none
      - name: Orders and WooCommerce adapter integration tests
        env:
          WPCAP_TEST_DB_HOST: 127.0.0.1
        run: php tests/integration/run.php
      - name: Concurrency/load smoke test (200 buyers, 8 scanners, 100 webhook deliveries; ~10 s)
        # Regression test for the check-in deadlock (false "admitted" responses, see docs/TESTING.md).
        env:
          WPCAP_TEST_DB_HOST: 127.0.0.1
        run: php tests/load/run.php --profile=ci

  package:
    runs-on: ubuntu-latest
    needs: [php, integration, license-guard]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: mbstring
      - name: Build installable plugin ZIP
        run: bash build/release.sh
      - name: No licence or self-update code in the built package
        run: |
          rm -rf build/unpacked && mkdir -p build/unpacked
          unzip -q build/dist/pass-captain.zip -d build/unpacked
          php tests/guard/no-license-code.php build/unpacked/pass-captain
      - uses: actions/upload-artifact@v4
        with:
          name: pass-captain
          path: build/dist/pass-captain.zip

  plugin-check:
    # Official WordPress.org Plugin Check (TODO A8) against exactly the files of the release ZIP.
    runs-on: ubuntu-latest
    needs: [package]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pass-captain
          path: build/dist
      - name: Unpack plugin ZIP
        run: |
          rm -rf build/plugin-check && mkdir -p build/plugin-check
          unzip -q build/dist/pass-captain.zip -d build/plugin-check
      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/plugin-check/pass-captain
          slug: pass-captain
