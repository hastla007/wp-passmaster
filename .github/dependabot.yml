# A195: weekly dependency updates (security updates arrive immediately via GitHub alerts).
# One grouped pull request per ecosystem and week keeps the CI matrix from running once per package.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups:
      composer:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /tests/a11y
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups:
      npm-tests-a11y:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ['*']
