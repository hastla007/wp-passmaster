# A195: dependency updates once a day at a fixed time, one grouped pull request per ecosystem
# (security updates as their own group), so the CI matrix runs once per group and not per package.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule: { interval: daily, time: "05:00", timezone: Europe/Vienna }
    open-pull-requests-limit: 2
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      all:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: daily, time: "05:00", timezone: Europe/Vienna }
    open-pull-requests-limit: 2
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      all:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /tests/a11y
    schedule: { interval: daily, time: "05:00", timezone: Europe/Vienna }
    open-pull-requests-limit: 2
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      all:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: daily, time: "05:00", timezone: Europe/Vienna }
    open-pull-requests-limit: 2
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      all:
        applies-to: version-updates
        patterns: ["*"]
